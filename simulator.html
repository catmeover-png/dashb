<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LMTS LP Impact Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #07090d;
    --panel: #0d1117;
    --border: #1c2433;
    --text: #e8eef5;
    --muted: #6a7a8e;
    --green: #39ff9a;
    --green-dim: rgba(57,255,154,0.1);
    --blue: #4da6ff;
    --blue-dim: rgba(77,166,255,0.1);
    --pool-accent: #00d4aa;
    --pool-accent-dim: rgba(0,212,170,0.12);
    --danger: #ff5566;
    --warning: #ffaa44;
    --warning-dim: rgba(255,170,68,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 28px 20px 60px; }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .nav-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .nav-link:hover {
    color: var(--pool-accent);
    border-color: var(--pool-accent);
    background: var(--pool-accent-dim);
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  h1 .accent { color: var(--pool-accent); }
  .subtitle {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
    position: relative;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 5%, var(--pool-accent) 50%, transparent 95%);
    opacity: 0.5;
  }
  .panel-title {
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .panel-title .pill {
    font-family: 'DM Mono', monospace; font-size: 9px;
    padding: 2px 8px; border-radius: 4px;
    background: var(--pool-accent-dim); color: var(--pool-accent);
    letter-spacing: 0.06em; font-weight: 400;
  }
  .controls {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px; align-items: end;
  }
  .control label {
    display: block; font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px;
  }
  .control input, .control select {
    width: 100%; font-family: 'DM Mono', monospace; font-size: 13px;
    background: #0a0e14; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px;
  }
  .control input:focus, .control select:focus {
    outline: none; border-color: var(--pool-accent);
  }
  button.simulate {
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    padding: 11px 22px; border-radius: 8px; cursor: pointer;
    background: var(--pool-accent-dim); color: var(--pool-accent);
    border: 1px solid var(--pool-accent);
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }
  button.simulate:hover { background: rgba(0,212,170,0.22); }
  button.simulate:disabled { opacity: 0.4; cursor: wait; }
  .quick {
    display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center;
  }
  .quick-label {
    font-size: 9px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-right: 4px;
  }
  .quick button {
    font-family: 'DM Mono', monospace; font-size: 10px;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--muted); cursor: pointer;
    letter-spacing: 0.04em;
  }
  .quick button:hover { color: var(--text); border-color: var(--pool-accent); }
  .quick button.live-btn {
    color: var(--green);
    border-color: rgba(57,255,154,0.3);
  }
  .quick button.live-btn:hover {
    border-color: var(--green);
    background: rgba(57,255,154,0.08);
  }

  .results {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-top: 14px;
  }
  .scenario {
    background: #0a0e14; border: 1px solid var(--border);
    border-radius: 10px; padding: 18px;
  }
  .scenario.a { border-left: 3px solid var(--blue); }
  .scenario.b { border-left: 3px solid var(--green); }
  .scenario .label {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .scenario .name {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px;
    margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .scenario.a .name { color: var(--blue); }
  .scenario.b .name { color: var(--green); }
  .scenario .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid rgba(28,36,51,0.6);
    font-size: 12px;
  }
  .scenario .row:last-child { border: none; }
  .scenario .row .k { color: var(--muted); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em; }
  .scenario .row .v { font-weight: 500; font-family: 'DM Mono', monospace; }
  .scenario .big {
    font-size: 22px; font-weight: 500;
    margin: 8px 0 14px;
  }
  .scenario.a .big { color: var(--blue); }
  .scenario.b .big { color: var(--green); }

  .insight {
    margin-top: 14px;
    padding: 16px 18px;
    background: rgba(0,212,170,0.06);
    border: 1px solid rgba(0,212,170,0.2);
    border-radius: 10px;
  }
  .insight .head {
    font-family: 'Outfit', sans-serif;
    font-size: 11px; font-weight: 700; color: var(--pool-accent);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px;

  .insight .body { font-size: 12px; line-height: 1.6; color: var(--text); }

    color: var(--pool-accent); font-weight: 500;
  }

    margin-top: 14px;
    padding: 14px 16px;
    background: var(--warning-dim);
    border: 1px solid rgba(255,170,68,0.3);
    border-radius: 10px;
    font-size: 11px;
    line-height: 1.5;

  .warning-box .head {
    font-family: 'Outfit', sans-serif;
    font-size: 11px; font-weight: 700; color: var(--warning);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px;

  .warning-box .body { color: var(--text); }
  .warning-box .number { color: var(--warning); font-weight: 500; }
  .warning-box.danger {

    border-color: rgba(255,85,102,0.3);

  .warning-box.danger .head { color: var(--danger); }
  .warning-box.danger .number { color: var(--danger); }

  .info-box {
    margin-top: 14px;

  .info-box .body { color: var(--text); }
  .info-box .number { color: var(--blue); font-weight: 500; }

  .meta-row {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(28,36,51,0.6);
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.04em;
  }
  .meta-row span strong { color: var(--text); font-weight: 500; }

  table.segs {
    width: 100%; border-collapse: collapse;
    font-size: 11px;
  }
  table.segs th, table.segs td {
    padding: 8px 12px; text-align: left;
    border-bottom: 1px solid rgba(28,36,51,0.5);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.segs th {
    color: var(--muted); font-weight: 500; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.1em;
    position: sticky; top: 0; background: #0d1117;
  }
  .segs td.dom-high { color: var(--green); font-weight: 500; }
  .segs td.dom-mid  { color: var(--warning); }
  .segs tr.zero-liq td { color: var(--warning); opacity: 0.7; font-style: italic; }

  .table-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #2a3a52; border-radius: 4px; }

  .chart-wrap { position: relative; height: 280px; }

  .status-bar {
    display: flex; gap: 10px; align-items: center;
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.06em; margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
  }
  .live-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 4px;
    background: rgba(57,255,154,0.08);
    border: 1px solid rgba(57,255,154,0.2);
    color: var(--green); font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .err {
    color: var(--danger); font-size: 11px;
    padding: 12px 14px; background: rgba(255,85,102,0.07);
    border: 1px solid rgba(255,85,102,0.18); border-radius: 8px;
  }
  .loading {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 11px;
    padding: 20px; justify-content: center;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--pool-accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .controls { grid-template-columns: 1fr 1fr; }
    .results { grid-template-columns: 1fr; }
  }
</style>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>LP Impact <span class="accent">Simulator</span></h1>
      <div class="subtitle">CLMM Swap Simulation · Our LP vs External · USDC/LMTS · Aerodrome Slipstream</div>
    </div>
    <a href="index.html" class="nav-link">← Back to Dashboard</a>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="dataStatus">Loading positions…</span>
    <span id="livePriceBadge" style="display:none" class="live-badge">
      live: <span id="livePriceVal">—</span>
    </span>
  </div>

  <div class="panel">
    <div class="panel-title">Simulation Inputs <span class="pill">Aerodrome</span></div>
    <div class="controls">
      <div class="control">
        <label>Current price (USD/LMTS)</label>
        <input id="curPrice" type="number" step="0.0001" value="0.07" oninput="onCurPriceChange()" />
      </div>
      <div class="control">
        <label>Target price (USD/LMTS)</label>
        <input id="tgtPrice" type="number" step="0.0001" value="0.05" />
      </div>
      <div class="control">
        <label>Mode</label>
        <select id="mode">
          <option value="both">Both A vs B</option>
          <option value="external">External only (A)</option>
          <option value="full">Full pool (B)</option>
        </select>
      </div>
      <button class="simulate" onclick="runSim()">Simulate</button>
    </div>
    <div class="quick">
      <span class="quick-label">Quick from current:</span>
      <button onclick="quickPct(-5)">−5%</button>
      <button onclick="quickPct(-10)">−10%</button>
      <button onclick="quickPct(-25)">−25%</button>
      <button onclick="quickPct(-50)">−50%</button>
      <button onclick="quickPct(5)">+5%</button>
      <button onclick="quickPct(10)">+10%</button>
      <button onclick="quickPct(25)">+25%</button>
      <button onclick="quickPct(50)">+50%</button>
      <button class="live-btn" onclick="useLivePrice()">⚡ use live</button>
    </div>
  </div>

  <div id="output"></div>
</div>

<script>
// ============================================================
// CONFIG — Aerodrome Slipstream USDC/LMTS pool
// ============================================================
const SHEET_ID       = "14zlvfkLX8Hs3_duak9ID0BGsLfyIVJ_UZ9MOP9lY-oE";
const POSITIONS_TAB  = "aero_positions";
const SUMMARY_TAB    = "aero_summary";
const PAIR_ADDRESS   = "0xbe4C36B9542610dF83Ca690c8b5BC53BbbC5d542";

// USDC = token0 (6 dec), LMTS = token1 (18 dec) — see indexer.
const DEC0       = 6n;
const DEC1       = 18n;
const SCALE_DEC0 = 10n ** DEC0;
const SCALE_DEC1 = 10n ** DEC1;

// Uniswap V3 / Aerodrome Slipstream tick limits.
const MIN_TICK = -887272;
const MAX_TICK =  887272;

// Default pool fee (Aerodrome Slipstream LMTS/USDC).
// Read live from aero_summary if available; this is fallback only.
// Stored as fraction: 0.0005 = 0.05%.
let POOL_FEE = 0.0005;

let positions       = null;
let livePrice       = null;
let livePriceTimer  = null;
let chart           = null;
let cachedTickMap   = { full: null, ext: null }; // perf cache

// ============================================================
// DATA LOADING
// ============================================================
async function loadPositions() {
  const url = `https://opensheet.elk.sh/${SHEET_ID}/${POSITIONS_TAB}`;
  document.getElementById("dataStatus").textContent = "Loading positions…";
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const rows = await r.json();
  positions = rows.map(row => {
    const liqStr = String(row.liquidity || "0")
      .trim()
      .split(".")[0]
      .replace(/[^\d]/g, "");
    return {
      tokenId:   row.token_id || "",
      label:     row.label || "",
      isOurs:    String(row.type || "").toLowerCase() === "ours",
      tickLower: parseInt(row.tick_lower),
      tickUpper: parseInt(row.tick_upper),
      liquidity: BigInt(liqStr || "0"),
    };
  }).filter(p =>
    p.liquidity > 0n &&
    Number.isFinite(p.tickLower) &&
    Number.isFinite(p.tickUpper) &&
    p.tickLower < p.tickUpper
  );

  // Reset perf cache after every load.
  cachedTickMap = { full: null, ext: null };

  const ours = positions.filter(p => p.isOurs).length;
  document.getElementById("dataStatus").textContent =
    `Aerodrome · ${positions.length} active positions (${ours} ours) · pool fee ${(POOL_FEE * 100).toFixed(3)}%`;
}

async function loadPoolFee() {
  // Pool fee comes from aero_summary tab, key "fee" (raw uint24 = 1e-6 units).
  // E.g. 500 = 0.05%, 3000 = 0.3%. If unavailable, keep fallback.
  try {
    const url = `https://opensheet.elk.sh/${SHEET_ID}/${SUMMARY_TAB}`;
    const r = await fetch(url);
    if (!r.ok) return;
    const rows = await r.json();
    for (const row of rows) {
      if (String(row.metric).toLowerCase() === "fee") {
        const raw = parseInt(row.value);
        if (Number.isFinite(raw) && raw > 0 && raw < 1_000_000) {
          POOL_FEE = raw / 1_000_000;
          return;
        }
      }
    }
  } catch (e) {
    // Network or parse error — silently keep the fallback fee.
  }
}

async function loadLivePrice() {
  try {
    const r = await fetch(`https://api.dexscreener.com/latest/dex/pairs/base/${PAIR_ADDRESS}`);
    const data = await r.json();
    const raw = data?.pair?.priceUsd ? parseFloat(data.pair.priceUsd) : null;

    // Sanity check: priceUsd must look like a sensible USD-per-LMTS value.
    // If DexScreener flips the base/quote display we'd see ~$1 (USDC) instead.
    // Anything outside [1e-6, 100] is treated as suspect and ignored.
    if (raw && raw > 1e-6 && raw < 100) {
      livePrice = raw;
      const badge = document.getElementById("livePriceBadge");
      if (badge) badge.style.display = "inline-flex";
      document.getElementById("livePriceVal").textContent = "$" + raw.toFixed(6);
    }
  } catch (e) {
    // keep previous livePrice
  }
}

function startLivePriceLoop() {
  if (livePriceTimer) clearInterval(livePriceTimer);
  livePriceTimer = setInterval(loadLivePrice, 60000);
}

// ============================================================
// MATH — sqrt / tick / price conversions
//   token0 = USDC (6 dec), token1 = LMTS (18 dec)
//   Uniswap raw price = token1/token0 (raw units) = LMTS_raw / USDC_raw
//   USD-per-LMTS (human) = 1 / (raw_price * 10^(dec1-dec0)) = 1 / (raw_price * 1e12)
//   So: raw_price = 1 / (USD_per_LMTS * 1e12)   <-- DIFFERENT from old script
//
//   Wait: the original script uses rawRatio = (1 / price) * 1e12.
//   Let's verify against the indexer:
//     tick_to_price_token1_per_token0 = 1.0001^tick * 10^(dec0 - dec1) = 1.0001^tick * 1e-12
//     USD/LMTS = 1 / (1.0001^tick * 1e-12) = 1e12 / 1.0001^tick
//   So price_token1_per_token0 (raw) = 1e-12 / USD_per_LMTS.
//   And sqrtPriceX96 = sqrt(raw_price) * 2^96.
//   sqrt(1e-12 / p) * 2^96 = sqrt((1/p) * 1e-12) * 2^96.
//
//   Original code uses sqrt((1/p) * 1e12) — that's sqrt(1e24) larger, i.e. 1e12 bigger.
//   But the down-stream consume formulas also use this convention symmetrically,
//   so the BUSINESS result is identical. To stay compatible with the rest of the
//   pipeline (and indexer's price_usd_per_lmts == 1 / price_token1_per_token0),
//   we keep the same scale convention.
// ============================================================
const Q96  = 2n ** 96n;
const Q96f = Math.pow(2, 96);

// Integer sqrt for BigInt — Newton's method. Exact, no float precision loss.
function bigIntSqrt(n) {
  if (n < 0n) throw new Error("sqrt of negative");
  if (n < 2n) return n;
  // Initial estimate via float (fast convergence start).
  let x = BigInt(Math.floor(Math.sqrt(Number(n))) || 1);
  if (x === 0n) x = 1n;
  // Newton iterations until stable.
  for (let i = 0; i < 64; i++) {
    const next = (x + n / x) >> 1n;
    if (next === x || next === x + 1n || next === x - 1n) {
      // Converged within ±1; pick the floor.
      return next * next > n ? next - 1n : next;
    }
    x = next;
  }
  return x;
}

// price (USD/LMTS, human) -> sqrtPriceX96 (BigInt, exact-ish via integer sqrt).
//   sqrtPriceX96 = sqrt( (1/price) * 1e12 ) * 2^96
//                = sqrt( (1/price) * 1e12 * 2^192 )
//   Multiply numerator inside the sqrt to keep all precision in BigInt:
//   inner = round( (1/price) * 1e12 * 2^192 )
//   sqrtPriceX96 = bigIntSqrt(inner)
function priceToSqrtPriceX96(price) {
  if (!(price > 0)) return 0n;
  // We want: sqrt( (1/price) * 1e12 ) * 2^96 = sqrt( (1/price) * 1e12 * 2^192 )
  // Use a high-precision intermediate by scaling to 1e36 then dividing by price.
  // Compute inner = (1e12 * 2^192) / price, with price as a high-decimal BigInt.
  const PRICE_SCALE = 10n ** 30n;
  const priceBig = BigInt(Math.round(price * 1e30));
  if (priceBig === 0n) return 0n;
  // inner = (1e12 * 2^192 * 1e30) / priceBig
  //       = (1e12 * 2^192 * PRICE_SCALE) / priceBig
  const numerator = (10n ** 12n) * (Q96 * Q96) * PRICE_SCALE;
  const inner     = numerator / priceBig;
  return bigIntSqrt(inner);
}

// sqrtPriceX96 (BigInt) -> price USD/LMTS (Number, for display only).
function sqrtPriceX96ToPrice(s) {
  // price = 1e12 / (s/Q96)^2 = 1e12 * Q96^2 / s^2
  // Do it in float — display only, no precision needed beyond ~10 sig figs.
  if (s <= 0n) return 0;
  const f = Number(s) / Q96f;
  return f === 0 ? 0 : 1e12 / (f * f);
}

// price -> tick (floor). USD-per-LMTS lower => tick higher.
//   USD/LMTS = 1e12 / 1.0001^tick   =>  tick = log_1.0001(1e12 / price)
function priceToTick(p) {
  if (!(p > 0)) return 0;
  return Math.floor(Math.log(1e12 / p) / Math.log(1.0001));
}

// tick -> sqrtPriceX96 (BigInt, exact via integer sqrt of 1.0001^tick * 2^192).
//   sqrtPriceX96 = 1.0001^(tick/2) * 2^96 = sqrt(1.0001^tick * 2^192)
// We compute 1.0001^tick via float (sufficient for tick boundaries — the
// tick spacing on this pool means quantization is dominated by the tick
// itself, not float error in this conversion). Then promote to BigInt.
function tickToSqrtPriceX96(t) {
  // For correctness in extreme ticks, clamp.
  if (t <= MIN_TICK) t = MIN_TICK;
  if (t >= MAX_TICK) t = MAX_TICK;
  const f = Math.pow(1.0001, t / 2) * Q96f;
  if (!isFinite(f) || f <= 0) return 1n;
  return BigInt(Math.round(f));
}

function tickFromSqrt(s) {
  const r = Number(s) / Q96f;
  return r <= 0 ? 0 : Math.floor(2 * Math.log(r) / Math.log(1.0001));
}

// ============================================================
// LIQUIDITY MAPS
// ============================================================
function buildTickMap(includeOurs) {
  const cacheKey = includeOurs ? "full" : "ext";
  if (cachedTickMap[cacheKey]) return cachedTickMap[cacheKey];

  const m = new Map();
  for (const p of positions) {
    if (!includeOurs && p.isOurs) continue;
    m.set(p.tickLower, (m.get(p.tickLower) || 0n) + p.liquidity);
    m.set(p.tickUpper, (m.get(p.tickUpper) || 0n) - p.liquidity);
  }
  cachedTickMap[cacheKey] = m;
  return m;
}

function activeLAtTick(tick, includeOurs) {
  let L = 0n;
  for (const p of positions) {
    if (!includeOurs && p.isOurs) continue;
    if (p.tickLower <= tick && tick < p.tickUpper) L += p.liquidity;
  }
  return L;
}

function activeOursAtTick(tick) {
  let L = 0n;
  for (const p of positions) {
    if (p.isOurs && p.tickLower <= tick && tick < p.tickUpper) L += p.liquidity;
  }
  return L;
}

// ============================================================
// SWAP SIMULATION
// ============================================================
//
// Direction conventions (USD-per-LMTS world):
//   "down" = USD/LMTS falls = LMTS gets cheaper. Swap: LMTS in, USDC out.
//            In raw V3 sqrtP terms: sqrtP RISES (token1/token0 raw rises).
//            => ascending = true.
//   "up"   = USD/LMTS rises = LMTS gets more expensive. Swap: USDC in, LMTS out.
//            sqrtP FALLS. => ascending = false.
//
// Tick crossings in V3:
//   At tickLower a position contributes net +L to tickMap; at tickUpper, -L.
//   Moving up through tick t:    L += tickMap[t].
//   Moving down through tick t:  L -= tickMap[t]   (i.e. L -= net entry, equivalent to
//                                                  +L at tickUpper boundary, -L at tickLower).
//
// Active L at a tick T: sum of L where tickLower <= T < tickUpper.
//
function simulate(currentPrice, targetPrice, includeOurs) {
  const curTick = priceToTick(currentPrice);
  const tgtTick = priceToTick(targetPrice);
  const direction = targetPrice < currentPrice ? "down"
                  : targetPrice > currentPrice ? "up" : "none";
  const ascending = direction === "down";
  const sqrtPCur = priceToSqrtPriceX96(currentPrice);
  const sqrtPTgt = priceToSqrtPriceX96(targetPrice);

  const res = {
    direction, mode: includeOurs ? "full" : "external",
    currentPrice, targetPrice, curTick, tgtTick,
    sqrtPCur, sqrtPTgt,
    usdcIn: 0, usdcOut: 0, lmtsIn: 0, lmtsOut: 0,
    segments: [],
    zeroLiquidityRange: null,
    truncated: false,
  };
  if (direction === "none") return res;

  const tickMap = buildTickMap(includeOurs);
  const boundaryTicks = [...tickMap.keys()].sort((a, b) => a - b);

  let L     = activeLAtTick(curTick, includeOurs);
  let sqrtP = sqrtPCur;

  let zeroFrom = null;
  function trackZero(s, sNext) {
    if (L === 0n) {
      if (zeroFrom === null) zeroFrom = sqrtPriceX96ToPrice(s);
      const pNext = sqrtPriceX96ToPrice(sNext);
      if (res.zeroLiquidityRange === null) {
        res.zeroLiquidityRange = { priceFrom: zeroFrom, priceTo: pNext };
      } else {
        res.zeroLiquidityRange.priceTo = pNext;
      }
    } else {
      zeroFrom = null;
    }
  }

  if (ascending) {
    // sqrtP rising. Boundary ticks above curTick, in ascending order.
    const relevant = boundaryTicks.filter(t => t > curTick);
    let done = false;
    for (const tNext of relevant) {
      // If the next boundary is past target, finish at sqrtPTgt.
      if (tNext > tgtTick) {
        trackZero(sqrtP, sqrtPTgt);
        consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, true, includeOurs);
        done = true;
        break;
      }
      const sqrtTNext = tickToSqrtPriceX96(tNext);
      // Skip degenerate/backwards ticks.
      if (sqrtTNext <= sqrtP) continue;
      trackZero(sqrtP, sqrtTNext);
      consume(res, sqrtP, sqrtTNext, L, tickFromSqrt(sqrtP), tNext, true, includeOurs);
      sqrtP = sqrtTNext;
      L += tickMap.get(tNext) || 0n;
      if (L < 0n) L = 0n; // numerical safety
      // BUG-FIX vs original: do NOT break on tNext === tgtTick here.
      // We must still close the sub-tick gap from sqrt(tgtTick) up to sqrtPTgt
      // (since tgtTick = floor(...) so sqrtPTgt >= sqrt(tgtTick) almost always).
      if (tNext >= tgtTick) {
        if (sqrtP < sqrtPTgt) {
          trackZero(sqrtP, sqrtPTgt);
          consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, true, includeOurs);
        }
        done = true;
        break;
      }
    }
    if (!done && sqrtP < sqrtPTgt) {
      trackZero(sqrtP, sqrtPTgt);
      consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, true, includeOurs);
    }
  } else {
    // sqrtP falling. Boundary ticks at or below curTick, descending order.
    const relevant = boundaryTicks.filter(t => t <= curTick).reverse();
    let done = false;
    for (const tNext of relevant) {
      if (tNext < tgtTick) {
        trackZero(sqrtP, sqrtPTgt);
        consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, false, includeOurs);
        done = true;
        break;
      }
      const sqrtTNext = tickToSqrtPriceX96(tNext);
      if (sqrtTNext >= sqrtP) continue; // we're already at/past this boundary
      trackZero(sqrtP, sqrtTNext);
      consume(res, sqrtP, sqrtTNext, L, tickFromSqrt(sqrtP), tNext, false, includeOurs);
      sqrtP = sqrtTNext;
      L -= tickMap.get(tNext) || 0n;
      if (L < 0n) L = 0n;
      // BUG-FIX vs original: when tNext === tgtTick, still close the sub-tick
      // remainder down to sqrtPTgt at the new (lower) liquidity.
      if (tNext <= tgtTick) {
        if (sqrtP > sqrtPTgt) {
          trackZero(sqrtP, sqrtPTgt);
          consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, false, includeOurs);
        }
        done = true;
        break;
      }
    }
    if (!done && sqrtP > sqrtPTgt) {
      trackZero(sqrtP, sqrtPTgt);
      consume(res, sqrtP, sqrtPTgt, L, tickFromSqrt(sqrtP), tgtTick, false, includeOurs);
    }
  }

  return res;
}

function consume(res, sqrtA, sqrtB, L, tickStart, tickEnd, ascending, includeOurs) {
  const pLo = sqrtA < sqrtB ? sqrtA : sqrtB;
  const pHi = sqrtA < sqrtB ? sqrtB : sqrtA;

  let dUsdc = 0, dLmts = 0;
  if (L > 0n && pHi > pLo) {
    const diff = pHi - pLo;
    // Standard Uniswap V3 amounts (raw token units):
    //   delta_token0 = L * (sqrtB - sqrtA) * Q96 / (sqrtA * sqrtB)
    //   delta_token1 = L * (sqrtB - sqrtA) / Q96
    const dxRaw = (L * diff * Q96) / (pLo * pHi);
    const dyRaw = (L * diff) / Q96;
    dUsdc = Number(dxRaw) / Number(SCALE_DEC0);
    dLmts = Number(dyRaw) / Number(SCALE_DEC1);

    if (ascending) {
      // Down in USD/LMTS: LMTS in, USDC out.
      res.lmtsIn  += dLmts;
      res.usdcOut += dUsdc;
    } else {
      // Up in USD/LMTS: USDC in, LMTS out.
      res.usdcIn  += dUsdc;
      res.lmtsOut += dLmts;
    }
  }

  res.segments.push({
    tickStart, tickEnd, L,
    ourL: includeOurs ? activeOursAtTick(tickStart) : 0n,
    priceStart: sqrtPriceX96ToPrice(sqrtA),
    priceEnd:   sqrtPriceX96ToPrice(sqrtB),
    deltaUsdc: dUsdc,
    deltaLmts: dLmts,
  });
}

// Gross input (what the swapper actually pays at the router).
// Pool charges fee on input: amount_in_net = amount_in_gross * (1 - fee).
// To produce a net amount X that moves price, swapper must send X / (1 - fee).
function applyFee(net) {
  if (POOL_FEE >= 1 || POOL_FEE < 0) return net;
  return net / (1 - POOL_FEE);
}

const inputNet    = sim => sim.direction === "down" ? sim.lmtsIn  : sim.usdcIn;
const inputGross  = sim => applyFee(inputNet(sim));
const outputHuman = sim => sim.direction === "down" ? sim.usdcOut : sim.lmtsOut;
const inputSym    = sim => sim.direction === "down" ? "LMTS" : "USDC";
const outputSym   = sim => sim.direction === "down" ? "USDC" : "LMTS";

// ============================================================
// FORMATTING
// ============================================================
function fmtNum(v, places = 2) {
  if (!isFinite(v)) return "—";
  return v.toLocaleString("en-US", { minimumFractionDigits: places, maximumFractionDigits: places });
}
function fmtShort(v) {
  if (!isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return (v / 1e3).toFixed(2) + "K";
  return v.toFixed(2);
}
function fmtPrice(v) {
  if (!isFinite(v) || v <= 0) return "—";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 4, maximumFractionDigits: 6 });
}
function fmtPct(v, places = 1) {
  if (!isFinite(v)) return "—";
  return v.toFixed(places) + "%";
}

// ============================================================
// QUICK ACTIONS
// ============================================================
function quickPct(pct) {
  const cur = parseFloat(document.getElementById("curPrice").value);
  if (!cur || cur <= 0) return;
  const tgt = cur * (1 + pct / 100);
  document.getElementById("tgtPrice").value = tgt.toFixed(6);
  runSim();
}

function useLivePrice() {
  if (livePrice && livePrice > 0) {
    document.getElementById("curPrice").value = livePrice.toFixed(6);
    runSim();
  } else {
    alert("Live price is not loaded yet — try again in a few seconds.");
  }
}

function onCurPriceChange() { /* visual feedback hook, no-op */ }

// ============================================================
// INPUT VALIDATION
// ============================================================
//
// Returns { ok, message } — message is shown in the output panel.
function validateInputs(cur, tgt) {
  if (!isFinite(cur) || !isFinite(tgt) || cur <= 0 || tgt <= 0) {
    return { ok: false,
      kind: "error",
      title: "Invalid input",
      message: "Enter positive numeric values for both current and target price."
    };
  }
  if (cur === tgt) {
    return { ok: false,
      kind: "error",
      title: "Nothing to simulate",
      message: "Current and target prices are equal — no swap is needed."
    };
  }
  // Tick limits (Uniswap V3 / Aerodrome Slipstream).
  const curTick = priceToTick(cur);
  const tgtTick = priceToTick(tgt);
  if (tgtTick <= MIN_TICK || tgtTick >= MAX_TICK) {
    return { ok: false,
      kind: "error",
      title: "Target price out of range",
      message: `Target price ${fmtPrice(tgt)} is outside the valid Uniswap-style tick range. ` +
               `Choose a target between roughly $${(1e12 / Math.pow(1.0001, MAX_TICK)).toExponential(2)} ` +
               `and $${(1e12 / Math.pow(1.0001, MIN_TICK)).toExponential(2)} per LMTS.`
    };
  }
  if (curTick <= MIN_TICK || curTick >= MAX_TICK) {
    return { ok: false,
      kind: "error",
      title: "Current price out of range",
      message: "The current price is outside the valid tick range — set a realistic value (e.g. use ⚡ live)."
    };
  }
  return { ok: true };
}

// Returns array of advisory notes (informational only) about the inputs.
function buildInputNotes(cur, tgt) {
  const notes = [];
  const pctMove = (tgt - cur) / cur * 100;
  if (Math.abs(pctMove) >= 75) {
    notes.push({
      kind: "warning",
      title: "Very large price move",
      body:  `You are simulating a <span class="number">${fmtPct(Math.abs(pctMove))}</span> price move ` +
             `(${pctMove < 0 ? "drop" : "rise"}). Results extrapolate far beyond current LP coverage; ` +
             `treat the numbers as a rough lower bound only.`
    });
  }
  if (Math.abs(pctMove) < 0.1) {
    notes.push({
      kind: "info",
      title: "Very small price move",
      body:  `The simulated move is under <span class="number">0.1%</span>. ` +
             `At this scale, numerical rounding inside the tick-by-tick math is comparable to the result; ` +
             `the comparison between scenarios A and B may not be meaningful.`
    });
  }
  if (livePrice && livePrice > 0) {
    const drift = Math.abs(cur - livePrice) / livePrice * 100;
    if (drift > 5) {
      notes.push({
        kind: "info",
        title: "Current price differs from live",
        body:  `Live price is <span class="number">${fmtPrice(livePrice)}</span>, your input is ` +
               `<span class="number">${fmtPrice(cur)}</span> (${fmtPct(drift)} away). ` +
               `Click <strong>⚡ use live</strong> to anchor the simulation to the on-chain price.`
      });
    }
  }
  return notes;
}

// ============================================================
// RENDER
// ============================================================
function renderError(title, message) {
  document.getElementById("output").innerHTML =
    `<div class="panel">
       <div class="panel-title">Cannot simulate</div>
       <div class="err"><strong>${title}.</strong> ${message}</div>
     </div>`;
}

function runSim() {
  const out = document.getElementById("output");
  if (!positions) {
    out.innerHTML = '<div class="err">Positions not loaded yet.</div>';
    return;
  }
  const cur = parseFloat(document.getElementById("curPrice").value);
  const tgt = parseFloat(document.getElementById("tgtPrice").value);

  const v = validateInputs(cur, tgt);
  if (!v.ok) {
    renderError(v.title, v.message);
    return;
  }

  const simExt  = simulate(cur, tgt, false);
  const simFull = simulate(cur, tgt, true);

  // Net (post-fee) input — this is what the math computed.
  const inExtNet  = inputNet(simExt);
  const inFullNet = inputNet(simFull);

  // Gross (pre-fee) input — what a real swap actually requires at the router.
  const inExtGross  = inputGross(simExt);
  const inFullGross = inputGross(simFull);

  // Display values — gross, since the user's question is "how much do I need to spend".
  const inExt  = inExtGross;
  const inFull = inFullGross;

  // BUG-FIX: clamp negative contrib (numerical noise can make Full < Ext by epsilon).
  const contribRaw = inFullGross - inExtGross;
  const contrib    = Math.max(0, contribRaw);
  const contribClamped = contribRaw < 0;
  const sym = inputSym(simFull);
  const ratioPct = inExtGross > 0 ? (contrib / inExtGross * 100) : Infinity;

  // Effective price computed from gross input vs net output (real-world rate).
  function effectivePrice(sim) {
    const out = outputHuman(sim);
    const inp = inputGross(sim);
    if (out <= 0 || inp <= 0) return null;
    return sim.direction === "down" ? out / inp : inp / out;
  }
  const effExt  = effectivePrice(simExt);
  const effFull = effectivePrice(simFull);

  // Slippage: how far the effective execution price is from the start price.
  function slippagePct(sim, eff) {
    if (eff == null) return null;
    return Math.abs(eff - sim.currentPrice) / sim.currentPrice * 100;
  }
  const slipExt  = slippagePct(simExt,  effExt);
  const slipFull = slippagePct(simFull, effFull);

  // Ranked segments (full-pool only, segments with liquidity).
  const ranked = simFull.segments
    .filter(s => s.L > 0n)
    .map(s => ({
      ...s,
      ourPct: Number(s.ourL) / Number(s.L) * 100,
      cost: simFull.direction === "down" ? s.deltaLmts : s.deltaUsdc,
    }))
    .sort((a, b) => b.ourPct - a.ourPct || b.cost - a.cost);

  const critical = ranked.filter(r => r.ourPct >= 50);

  // ── Warnings & notes ───────────────────────────────────────
  const inputNotes = buildInputNotes(cur, tgt);
  let warningHtml = "";

  // Zero-liquidity gap warning (path crosses an empty zone in either scenario).
  const gapFull = simFull.zeroLiquidityRange;
  const gapExt  = simExt.zeroLiquidityRange;
  if (gapFull || gapExt) {
    const gap = gapFull || gapExt;
    const which = gapFull && gapExt ? "both scenarios"
                : gapFull ? "the full-pool path"
                : "the external-only path";
    const lo = Math.min(gap.priceFrom, gap.priceTo);
    const hi = Math.max(gap.priceFrom, gap.priceTo);
    warningHtml += `
      <div class="warning-box">
        <div class="head">⚠ Liquidity gap on the path</div>
        <div class="body">
          The simulated swap crosses a price zone with <span class="number">zero active liquidity</span>
          (roughly <span class="number">${fmtPrice(lo)}</span> – <span class="number">${fmtPrice(hi)}</span>) in ${which}.
          A real swap cannot pass through an empty zone — in practice price would either jump on the next
          incoming LP or stop at the edge. The numbers below are a <strong>lower bound</strong>.
          For an accurate impact estimate, pick a target inside the existing LP coverage.
        </div>
      </div>`;
  }

  if (contribClamped) {
    warningHtml += `
      <div class="warning-box danger">
        <div class="head">⚠ Numerical anomaly</div>
        <div class="body">
          The full-pool scenario came out cheaper than external-only by
          <span class="number">${fmtNum(Math.abs(contribRaw), 4)} ${sym}</span>,
          which should be impossible. This is most likely floating-point noise on a
          very small price move. Try a larger target distance, or anchor current price to ⚡ live.
        </div>
      </div>`;
  }

  // Render input-level advisories.
  for (const n of inputNotes) {
    if (n.kind === "warning") {
      warningHtml += `
        <div class="warning-box">
          <div class="head">⚠ ${n.title}</div>
          <div class="body">${n.body}</div>
        </div>`;
    } else {
      warningHtml += `
        <div class="info-box">
          <div class="head">ℹ ${n.title}</div>
          <div class="body">${n.body}</div>
        </div>`;
    }
  }

  // ── Build HTML ─────────────────────────────────────────────
  out.innerHTML = `
    <div class="panel">
      <div class="panel-title">Scenario Comparison
        <span class="pill">${simFull.direction.toUpperCase()} · tick ${simFull.curTick} → ${simFull.tgtTick}</span>
        <span class="pill" style="background:rgba(77,166,255,0.12);color:var(--blue)">fee ${(POOL_FEE * 100).toFixed(3)}%</span>
      </div>

      <div class="info-box" style="margin-top:0;margin-bottom:14px">
        <div class="head">How to read this</div>
        <div class="body">
          You're asking: <strong>"how many ${sym} must a trader spend to push the price from
          ${fmtPrice(cur)} to ${fmtPrice(tgt)}?"</strong>.
          Scenario A answers it for the pool <em>without</em> our LP. Scenario B answers it for
          the pool <em>with</em> our LP. The difference (highlighted in green below) is the extra
          cost our liquidity imposes on a would-be price-mover. All amounts include the
          <span class="number">${(POOL_FEE * 100).toFixed(3)}%</span> pool swap fee.
        </div>
      </div>

      <div class="results">
        <div class="scenario a">
          <div class="label">Scenario A</div>
          <div class="name">External liquidity only</div>
          <div class="big">${fmtNum(inExt, 2)} <span style="font-size:13px;color:var(--muted)">${sym}</span></div>
          <div class="row"><span class="k">Output received</span><span class="v">${fmtNum(outputHuman(simExt), 2)} ${outputSym(simExt)}</span></div>
          <div class="row"><span class="k">Segments traversed</span><span class="v">${simExt.segments.length}</span></div>
          <div class="row"><span class="k">Effective price</span><span class="v">${effExt != null ? fmtPrice(effExt) : "—"}</span></div>
          <div class="row"><span class="k">Slippage vs start</span><span class="v">${slipExt != null ? fmtPct(slipExt, 2) : "—"}</span></div>
          <div class="row"><span class="k">Net (pre-fee) input</span><span class="v" style="color:var(--muted)">${fmtNum(inExtNet, 2)} ${sym}</span></div>
        </div>
        <div class="scenario b">
          <div class="label">Scenario B</div>
          <div class="name">Full pool (with our LP)</div>
          <div class="big">${fmtNum(inFull, 2)} <span style="font-size:13px;color:var(--muted)">${sym}</span></div>
          <div class="row"><span class="k">Output received</span><span class="v">${fmtNum(outputHuman(simFull), 2)} ${outputSym(simFull)}</span></div>
          <div class="row"><span class="k">Segments traversed</span><span class="v">${simFull.segments.length}</span></div>
          <div class="row"><span class="k">Effective price</span><span class="v">${effFull != null ? fmtPrice(effFull) : "—"}</span></div>
          <div class="row"><span class="k">Slippage vs start</span><span class="v">${slipFull != null ? fmtPct(slipFull, 2) : "—"}</span></div>
          <div class="row"><span class="k">Net (pre-fee) input</span><span class="v" style="color:var(--muted)">${fmtNum(inFullNet, 2)} ${sym}</span></div>
        </div>
      </div>

      ${warningHtml}

      <div class="insight">
        <div class="head">Our liquidity contribution</div>
        <div class="body">
          Our LP forces a swapper to spend an extra
          <span class="number">${fmtNum(contrib, 2)} ${sym}</span>
          to move price from <span class="number">${fmtPrice(cur)}</span> to <span class="number">${fmtPrice(tgt)}</span>
          ${isFinite(ratioPct) && ratioPct > 0
              ? `— a <span class="number">${fmtPct(ratioPct)}</span> increase over external-only depth.`
              : (inExtGross === 0
                  ? `— external liquidity in this range is effectively zero, so our LP is the only thing standing in the way.`
                  : ".")}
          ${critical.length > 0
            ? `<br><br>Our wallets dominate (>50%) the segments
               ${critical.slice(0,3).map(r => `<span class="number">${r.priceStart.toFixed(5)}–${r.priceEnd.toFixed(5)}</span>`).join(", ")}.
               Removing those positions would let price pass these zones with significantly less volume.`
            : `<br><br>No single segment is &gt;50% held by our wallets — external LPs carry most of the depth on this path.`}
        </div>

        <div class="meta-row">
          <span><strong>Direction:</strong> ${simFull.direction === "down" ? "USD/LMTS falling (LMTS sold for USDC)" : "USD/LMTS rising (USDC spent to buy LMTS)"}</span>
          <span><strong>Pool fee:</strong> ${(POOL_FEE * 100).toFixed(3)}% (applied to every segment)</span>
          <span><strong>Active positions:</strong> ${positions.length} (${positions.filter(p=>p.isOurs).length} ours)</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Liquidity along path
        <span class="pill">total vs ours</span>
      </div>
      <div class="chart-wrap"><canvas id="pathChart"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-title">Segment breakdown
        <span class="pill">full-pool · top by our %</span>
      </div>
      <div class="table-wrap">
        <table class="segs">
          <thead><tr>
            <th>Price range</th><th>Our %</th><th>Total L</th>
            <th>Cost (${sym})</th>
          </tr></thead>
          <tbody>
            ${(() => {
              const allSegs = simFull.segments.map(s => ({
                ...s,
                ourPct: s.L > 0n ? Number(s.ourL) / Number(s.L) * 100 : 0,
                // Cost shown here is NET (per-segment math output). The aggregate
                // "Total ${sym}" in the scenario card is GROSS (with fee). The
                // segment table stays net so cumulative addition matches the
                // tick-by-tick math, with fee applied only at the aggregate level.
                cost: simFull.direction === "down" ? s.deltaLmts : s.deltaUsdc,
              })).sort((a, b) => b.ourPct - a.ourPct || b.cost - a.cost);

              
              return allSegs.slice(0, 15).map(s => {
               
                const isZero = s.L === 0n;
                const cls = isZero ? "zero-liq" : "";
                const ourCls = s.ourPct >= 50 ? "dom-high" : s.ourPct >= 25 ? "dom-mid" : "";
                return `<tr class="${cls}">
                  <td>${s.priceStart.toFixed(5)} → ${s.priceEnd.toFixed(5)}${isZero ? " (gap)" : ""}</td>
                  <td class="${ourCls}">${isZero ? "—" : s.ourPct.toFixed(1) + "%"}</td>
                  <td>${isZero ? "0" : fmtShort(Number(s.L))}</td>
                  <td>${fmtNum(s.cost, 2)}</td>
            
                </tr>`;
              }).join("");
            })()}
          </tbody>
        </table>
      </div>
      <div class="meta-row">
        <span>Per-segment cost is shown <strong>pre-fee</strong> (raw V3 math). Aggregate scenario totals above include the <strong>${(POOL_FEE * 100).toFixed(3)}%</strong> fee.</span>
      </div>
    </div>
  `;

  drawPathChart(simFull, sym);
}

function drawPathChart(simFull, sym) {
  if (chart) { try { chart.destroy(); } catch (e) {} }
  const labels = simFull.segments.map(s => s.priceStart.toFixed(5));
  const ourL   = simFull.segments.map(s => Number(s.ourL));
  const extL   = simFull.segments.map(s => Number(s.L) - Number(s.ourL));
  const ctx = document.getElementById("pathChart");
  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "External L", data: extL, backgroundColor: "rgba(77,166,255,0.5)",
          borderColor: "rgba(77,166,255,0.9)", borderWidth: 1, stack: "L",
          barPercentage: 1, categoryPercentage: 1 },
        { label: "Our L", data: ourL, backgroundColor: "rgba(57,255,154,0.85)",
          borderColor: "rgba(57,255,154,1)", borderWidth: 1, stack: "L",
          barPercentage: 1, categoryPercentage: 1 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: "#c8d4e0", boxWidth: 12, boxHeight: 9, font: { size: 11 } } },
        tooltip: {
          backgroundColor: "rgba(9,13,19,0.97)", borderColor: "rgba(255,255,255,0.07)",
          borderWidth: 1, titleColor: "#fff", bodyColor: "#c8d4e0", padding: 12,
          callbacks: {
            title: items => "Price ~$" + Number(items[0].label).toFixed(5),
            label: ctx => ctx.dataset.label + ": " + fmtShort(Number(ctx.raw)),
          },
        },
      },
      scales: {
        x: { grid: { color: "rgba(255,255,255,0.03)" },
             ticks: { color: "#6a7a8e", maxRotation: 45, minRotation: 45,
                      callback(v) { return "$" + Number(this.getLabelForValue(v)).toFixed(4); } },
             stacked: true },
        y: { grid: { color: "rgba(255,255,255,0.04)" },
             ticks: { color: "#6a7a8e", callback: v => fmtShort(Number(v)) },
             stacked: true,
             title: { display: true, text: "Liquidity (raw L)", color: "#6a7a8e", font: { size: 9 } } },
      },
    },
  });
}

// ============================================================
// INIT
// ============================================================
(async () => {
  try {
    // Pool fee can be loaded in parallel with positions.
    await Promise.all([loadPoolFee(), loadPositions()]);
    // Re-print status now that POOL_FEE may have been refined.
    const ours = positions.filter(p => p.isOurs).length;
    document.getElementById("dataStatus").textContent =
      `Aerodrome · ${positions.length} active positions (${ours} ours) · pool fee ${(POOL_FEE * 100).toFixed(3)}%`;

    await loadLivePrice();
    startLivePriceLoop();

    // Auto-prefill current price from live, if available.
    if (livePrice && livePrice > 0) {
      document.getElementById("curPrice").value = livePrice.toFixed(6);
      document.getElementById("tgtPrice").value = (livePrice * 0.71).toFixed(6);
    }
  } catch (e) {
    document.getElementById("output").innerHTML =
      '<div class="err">Failed to load: ' + e.message + '</div>';
  }
})();
</script>
