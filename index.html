<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMTS LP Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #07090d;
      --panel: #0d1117;
      --border: #1c2433;
      --border-bright: #2a3a52;
      --text: #e8eef5;
      --muted: #6a7a8e;
      --green: #39ff9a;
      --green-dim: rgba(57,255,154,0.1);
      --blue: #4da6ff;
      --blue-dim: rgba(77,166,255,0.1);
      --danger: #ff5566;
      --pool-accent: #c084fc;
      --pool-accent-dim: rgba(192,132,252,0.12);
      --pool-accent-glow: rgba(192,132,252,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      font-variant-numeric: tabular-nums;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-left h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: normal;
    }
    .header-left h1 .accent { color: var(--pool-accent); }
    .header-left .subtitle {
      font-size: 10px;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .header-right {
       display: flex;
       flex-direction: column;
       align-items: flex-end;
       gap: 8px;
     }

     .nav-link {
       font-family: 'DM Mono', monospace;
       font-size: 11px;
       padding: 8px 18px;
       border: 1px solid var(--border);
       border-radius: 8px;
       background: var(--panel);
       color: var(--muted);
       text-decoration: none;
       letter-spacing: 0.05em;
       transition: background 0.18s, color 0.18s, border-color 0.18s;
     }

     .nav-link:hover {
       color: var(--pool-accent);
       border-color: var(--pool-accent);
       background: var(--pool-accent-dim);
     }

    @media (max-width: 640px) {
     .header-right { align-items: flex-start; }
     }


    
    .switcher {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .switcher button {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 8px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      background: transparent;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .switcher button.active {
      background: var(--pool-accent-dim);
      color: var(--pool-accent);
      box-shadow: 0 0 12px var(--pool-accent-glow);
    }
    .switcher button:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 18px;
      letter-spacing: 0.06em;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(57,255,154,0.08);
      border: 1px solid rgba(57,255,154,0.2);
      color: var(--green);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .live-badge .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px 14px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, var(--pool-accent) 50%, transparent 95%);
      opacity: 0.5;
    }
    .card .label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card .value {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .card .value.accent { color: var(--pool-accent); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-variant-numeric: normal;
    }
    .panel-title .pill {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--pool-accent-dim);
      color: var(--pool-accent);
      letter-spacing: 0.06em;
    }
    .panel-title .pill-live {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(57,255,154,0.08);
      color: var(--green);
      border: 1px solid rgba(57,255,154,0.2);
      letter-spacing: 0.06em;
    }
    .panel-title .live-ts {
      margin-left: auto;
      font-size: 9px;
      color: rgba(57,255,154,0.4);
      letter-spacing: 0.06em;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 14px;
      align-items: start;
    }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .mini-table tr { border-bottom: 1px solid rgba(28,36,51,0.8); }
    .mini-table tr:last-child { border-bottom: none; }
    .mini-table th {
      color: var(--muted);
      font-weight: 400;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 9px 0;
      text-align: left;
      width: 55%;
    }
    .mini-table td {
      padding: 9px 0;
      text-align: right;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .mini-table td.green  { color: var(--green); }
    .mini-table td.blue   { color: var(--blue); }
    .mini-table td.accent { color: var(--pool-accent); }
    .table-wrap {
      max-height: 560px;
      overflow: auto;
      border-radius: 8px;
    }
    .table-wrap::-webkit-scrollbar { width: 3px; height: 3px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
    table.pos-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.pos-table th,
    table.pos-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(28,36,51,0.6);
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    table.pos-table th {
      color: var(--muted);
      font-weight: 500;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: sticky;
      top: 0;
      background: #0d1117;
      z-index: 2;
    }
    table.pos-table th.live-col { color: var(--green); opacity: 0.85; }
    table.pos-table tbody tr:hover { background: rgba(255,255,255,0.02); }
    .col-sep { border-left: 1px solid rgba(57,255,154,0.12) !important; }
    .live-val { color: var(--green) !important; }
    .live-dim { color: rgba(57,255,154,0.55) !important; }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-weight: 500;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .tag-ours { background: var(--green-dim); color: var(--green); }
    .tag-ext  { background: var(--blue-dim);  color: var(--blue); }
    .inrange  { color: var(--green); }
    .outrange { color: var(--muted); }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      gap: 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--pool-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      color: var(--danger);
      font-size: 11px;
      padding: 14px 16px;
      background: rgba(255,85,102,0.07);
      border: 1px solid rgba(255,85,102,0.18);
      border-radius: 8px;
      margin-top: 12px;
    }
    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .header { flex-direction: column; }
      .card .value { font-size: 19px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-left">
      <h1>LMTS / USDC&nbsp;<span class="accent" id="headerPoolName">UniV3</span></h1>
      <div class="subtitle" id="headerSubtitle">Uniswap V3 · Base Network · LP Position Tracker</div>
    </div>
    <div class="header-right">
  <div class="switcher">
    <button id="btnUni"  class="active" onclick="switchPool('uni')">&#x2B21; UniV3</button>
    <button id="btnAero"             onclick="switchPool('aero')">&#x25C8; Aerodrome</button>
  </div>

  <a href="simulator.html" class="nav-link">⚡ Simulator →</a>
</div>
  
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="lastUpdate">Loading…</span>
    <span id="livePriceBadge" style="display:none" class="live-badge">
      <span class="dot"></span>live: <span id="livePriceVal">—</span>
    </span>
  </div>

  <div id="dashContent">
    <div class="loading"><div class="spinner"></div><span>Fetching data…</span></div>
  </div>

</div>
<script>
// ── CONFIG ───────────────────────────────────────────────
const POOLS = {
  uni: {
    sheetId:    "1oJf881yq6bhUSlLBvuiG8n_hj2pWvPO-7lvis0eKXVs",
    name:       "UniV3",
    subtitle:   "Uniswap V3 · Base Network · LP Position Tracker",
    accent:     "#c084fc",
    accentDim:  "rgba(192,132,252,0.12)",
    accentGlow: "rgba(192,132,252,0.2)",
    barOur:     "rgba(57,255,154,0.88)",
    barExt:     "rgba(192,132,252,0.28)",
    barOurB:    "rgba(57,255,154,1)",
    barExtB:    "rgba(192,132,252,0.6)",
    lineColor:  "#c084fc",
    lineFill:   "rgba(192,132,252,0.1)",
    sheets:     { buckets:"buckets", snapshots:"snapshots", positions:"positions" },
    hasLive:    false,
    dexPair:    "0x9e4a0e8df94a2b80af6a3a6e8a2fa4b3c4e9ffc5",
  },
  aero: {
    sheetId:    "14zlvfkLX8Hs3_duak9ID0BGsLfyIVJ_UZ9MOP9lY-oE",
    name:       "Aerodrome",
    subtitle:   "Aerodrome Slipstream · Base Network · LP Position Tracker",
    accent:     "#00d4aa",
    accentDim:  "rgba(0,212,170,0.12)",
    accentGlow: "rgba(0,212,170,0.2)",
    barOur:     "rgba(57,255,154,0.88)",
    barExt:     "rgba(0,212,170,0.28)",
    barOurB:    "rgba(57,255,154,1)",
    barExtB:    "rgba(0,212,170,0.6)",
    lineColor:  "#00d4aa",
    lineFill:   "rgba(0,212,170,0.1)",
    sheets:     { buckets:"aero_buckets", snapshots:"aero_snapshots", positions:"aero_positions" },
    hasLive:    true,
    dexPair:    "0xbe4C36B9542610dF83Ca690c8b5BC53BbbC5d542",
  }
};

let activePool  = "uni";
let charts      = {};
let livePrice   = null;
let livePriceTimer = null;
let cachedPositions = null;
let cachedCfg = null;

// ── THEME ────────────────────────────────────────────────
function applyTheme(cfg) {
  const r = document.documentElement;
  r.style.setProperty("--pool-accent",      cfg.accent);
  r.style.setProperty("--pool-accent-dim",  cfg.accentDim);
  r.style.setProperty("--pool-accent-glow", cfg.accentGlow);
}

// ── UTILS ────────────────────────────────────────────────
const num = v => { const x = Number(v); return isFinite(x) ? x : 0; };
function fmtShort(v) {
  if (!isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(2)+"M";
  if (a >= 1e3) return (v/1e3).toFixed(2)+"K";
  return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
}
const fmtUsd   = v => isFinite(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }) : "—";
const fmtPrice = v => isFinite(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits:4, maximumFractionDigits:6 }) : "—";
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + ": " + url);
  return r.json();
}
const sheetUrl = (id, tab) => "https://opensheet.elk.sh/" + id + "/" + tab;
const setText  = (id, v)   => { const el = document.getElementById(id); if (el) el.textContent = v; };
function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

// ── LIVE PRICE ────────────────────────────────────────────
async function fetchLivePrice(pairAddress) {
  try {
    const data = await fetchJson("https://api.dexscreener.com/latest/dex/pairs/base/" + pairAddress);
    const p = data && data.pair && data.pair.priceUsd;
    return p ? parseFloat(p) : null;
  } catch(e) {
    console.warn("DexScreener error:", e);
    return null;
  }
}

function startLivePriceLoop(cfg) {
  if (livePriceTimer) clearInterval(livePriceTimer);
  async function tick() {
    const p = await fetchLivePrice(cfg.dexPair);
    if (p && p > 0) {
      livePrice = p;
      const badge = document.getElementById("livePriceBadge");
      if (badge) badge.style.display = "inline-flex";
      setText("livePriceVal", fmtPrice(p));
      // update price card
      const priceEl = document.getElementById("price");
      if (priceEl) priceEl.textContent = fmtPrice(p);
      // refresh positions table
      if (cachedPositions) {
        refreshPositionsTable(cachedPositions, p, cfg.hasLive);
        refreshSummaryCards(cachedPositions, p);
      }
      // update live-ts timestamp
      const ts = document.getElementById("liveTs");
      if (ts) ts.textContent = "updated " + new Date().toUTCString().slice(17, 25) + "UTC";
    }
  }
  tick();
  livePriceTimer = setInterval(tick, 60000);
}

// ── LIVE POSITION MATH ────────────────────────────────────
function calcLive(tickLower, tickUpper, liquidityStr, priceUsd) {
  try {
    const Q96f = Math.pow(2, 96);
    const sqrtP_float = Math.sqrt((1 / priceUsd) * Math.pow(10, 12)) * Q96f;
    const Q96  = BigInt(2) ** BigInt(96);
    const sqrtP = BigInt(Math.round(sqrtP_float));
    const sqrtL = BigInt(Math.round(Math.pow(1.0001, tickLower / 2) * Q96f));
    const sqrtU = BigInt(Math.round(Math.pow(1.0001, tickUpper / 2) * Q96f));
    const L = BigInt(String(liquidityStr).trim().replace(/\..*/, ""));
    let a0 = BigInt(0), a1 = BigInt(0);
    if (sqrtP <= sqrtL) {
      a0 = L * Q96 / sqrtL - L * Q96 / sqrtU;
    } else if (sqrtP < sqrtU) {
      a0 = L * Q96 / sqrtP - L * Q96 / sqrtU;
      a1 = L * (sqrtP - sqrtL) / Q96;
    } else {
      a1 = L * (sqrtU - sqrtL) / Q96;
    }
    return {
      usdc:    Number(a0) / 1e6,
      lmts:    Number(a1) / 1e18,
      inRange: sqrtP > sqrtL && sqrtP < sqrtU,
    };
  } catch(e) {
    return { usdc: 0, lmts: 0, inRange: false };
  }
}

// ── SWITCH ────────────────────────────────────────────────
function switchPool(pool) {
  if (pool === activePool) return;
  activePool = pool;
  cachedPositions = null;
  livePrice = null;
  const cfg = POOLS[pool];
  applyTheme(cfg);
  document.getElementById("btnUni").classList.toggle("active",  pool === "uni");
  document.getElementById("btnAero").classList.toggle("active", pool === "aero");
  document.getElementById("headerPoolName").textContent = cfg.name;
  document.getElementById("headerSubtitle").textContent = cfg.subtitle;
  const badge = document.getElementById("livePriceBadge");
  if (badge) badge.style.display = "none";
  destroyCharts();
  renderDash(cfg);
}

// ── MAIN RENDER ───────────────────────────────────────────
async function renderDash(cfg) {
  cachedCfg = cfg;
  const content = document.getElementById("dashContent");
  content.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading ' + cfg.name + '…</span></div>';
  try {
    const [buckets, snapshots, positions] = await Promise.all([
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.buckets)),
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.snapshots)),
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.positions)),
    ]);
    cachedPositions = positions;
    const snap  = snapshots[snapshots.length - 1] || {};
    const price = num(snap.price_usd_per_lmts);

    setText("lastUpdate", "Updated " + (snap.timestamp_utc || "—") + " UTC  ·  Block " + (snap.last_block || "—"));
    content.innerHTML = buildHTML(cfg);

    setText("price",         fmtPrice(price));
    setText("openPositions", String(num(snap.open_positions)));
    setText("ourValueUsd",   "—");
    setText("extValueUsd",   "—");
    setText("ourUsdc", fmtUsd(num(snap.our_cur_usdc)));
    setText("ourLmts", fmtShort(num(snap.our_cur_lmts)) + " LMTS");
    setText("extUsdc", fmtUsd(num(snap.ext_cur_usdc)));
    setText("extLmts", fmtShort(num(snap.ext_cur_lmts)) + " LMTS");
    setText("owners",  num(snap.unique_real_owners).toLocaleString("en-US"));
    setText("inRange", num(snap.in_range_positions).toLocaleString("en-US"));
    setText("ourPos",  num(snap.our_positions).toLocaleString("en-US"));
    setText("tick",    num(snap.current_tick).toLocaleString("en-US"));

    buildLiqChart(cfg, buckets);
    buildPriceChart(cfg, snapshots);
    refreshPositionsTable(positions, price, cfg.hasLive);
    refreshSummaryCards(positions, price);
    startLivePriceLoop(cfg);
  } catch(err) {
    content.innerHTML = '<div class="error-msg">&#9888; ' + err.message + '</div>';
    console.error(err);
  }
}

// ── SUMMARY CARDS ─────────────────────────────────────────
function refreshSummaryCards(positions, price) {
  let ourV = 0, extV = 0;
  for (const p of positions) {
    const liq = String(p.liquidity || "0").trim();
    if (!liq || liq === "0" || liq === "") continue;
    let usdc, lmts;
    if (livePrice && p.live_cur_usdc !== undefined && p.live_cur_usdc !== "") {
      usdc = num(p.live_cur_usdc);
      lmts = num(p.live_cur_lmts);
    } else if (livePrice) {
      const c = calcLive(parseInt(p.tick_lower), parseInt(p.tick_upper), liq, livePrice);
      usdc = c.usdc; lmts = c.lmts;
    } else {
      usdc = num(p.cur_usdc); lmts = num(p.cur_lmts);
    }
    const val = usdc + lmts * (livePrice || price);
    if (p.type === "ours") ourV += val; else extV += val;
  }
  setText("ourValueUsd", fmtUsd(ourV));
  setText("extValueUsd", fmtUsd(extV));
}

// ── POSITIONS TABLE ───────────────────────────────────────
function refreshPositionsTable(positions, snapshotPrice, hasLive) {
  const body = document.getElementById("posBody");
  if (!body) return;
  body.innerHTML = "";

  const thead = document.getElementById("posHead");
  const useLiveCols = hasLive || !!livePrice;
  if (thead) {
    thead.innerHTML = "<tr>" +
      "<th>Token ID</th>" +
      "<th>Label</th>" +
      "<th>Price Range</th>" +
      "<th>Snapshot In Range</th>" +
      "<th>Snapshot USDC</th>" +
      "<th>Snapshot LMTS</th>" +
      (useLiveCols
        ? '<th class="live-col col-sep">&#9889; Live USDC</th>' +
          '<th class="live-col">&#9889; Live LMTS</th>' +
          '<th class="live-col">Live In Range</th>' +
          '<th class="live-col">Live Value USD</th>'
        : "<th>Value USD</th>") +
      "</tr>";
  }

  const currentPrice = livePrice || snapshotPrice;

  const rows = positions
    .filter(p => { const l = String(p.liquidity||"0").trim(); return l && l !== "0"; })
    .map(p => {
      const liq = String(p.liquidity || "0").trim();
      let lUsdc, lLmts, lInRange;
      const hasSheetLive = p.live_cur_usdc !== undefined && String(p.live_cur_usdc).trim() !== "";
      if (hasSheetLive) {
        lUsdc = num(p.live_cur_usdc);
        lLmts = num(p.live_cur_lmts);
        lInRange = String(p.live_in_range).toUpperCase() === "TRUE";
      } else if (livePrice) {
        const c = calcLive(parseInt(p.tick_lower), parseInt(p.tick_upper), liq, livePrice);
        lUsdc = c.usdc; lLmts = c.lmts; lInRange = c.inRange;
      } else {
        lUsdc = num(p.cur_usdc); lLmts = num(p.cur_lmts);
        lInRange = String(p.in_range).toUpperCase() === "TRUE";
      }
      return { ...p, _lu: lUsdc, _ll: lLmts, _li: lInRange, _lv: lUsdc + lLmts * currentPrice };
    })
    .sort((a, b) => b._lv - a._lv);

  rows.forEach(p => {
    const isOurs     = p.type === "ours";
    const snapIn     = String(p.in_range).toUpperCase() === "TRUE";
    const lo = Number(p.price_lower_usd_per_lmts);
    const hi = Number(p.price_upper_usd_per_lmts);
    const range = (isFinite(lo) && isFinite(hi))
      ? "$" + lo.toFixed(4) + " – $" + hi.toFixed(4)
      : (p.tick_lower || "—") + " – " + (p.tick_upper || "—");
    const snapVal = num(p.cur_usdc) + num(p.cur_lmts) * snapshotPrice;

    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td style="color:var(--muted);font-size:10px">' + (p.token_id || "—") + "</td>" +
      "<td><span class=\"tag " + (isOurs ? "tag-ours" : "tag-ext") + "\">" + (p.label || p.type || "ext") + "</span></td>" +
      '<td style="color:var(--muted);font-size:10px">' + range + "</td>" +
      '<td class="' + (snapIn ? "inrange" : "outrange") + '">' + (snapIn ? "● IN" : "○ OUT") + "</td>" +
      '<td style="color:var(--muted)">' + fmtUsd(num(p.cur_usdc)) + "</td>" +
      '<td style="color:var(--muted)">' + fmtShort(num(p.cur_lmts)) + "</td>" +
      (useLiveCols
        ? '<td class="live-val col-sep">' + fmtUsd(p._lu) + "</td>" +
          '<td class="live-dim">' + fmtShort(p._ll) + "</td>" +
          '<td class="' + (p._li ? "inrange" : "outrange") + '">' + (p._li ? "● IN" : "○ OUT") + "</td>" +
          '<td class="live-val" style="font-weight:500">' + fmtUsd(p._lv) + "</td>"
        : '<td style="font-weight:500">' + fmtUsd(snapVal) + "</td>") ;
    body.appendChild(tr);
  });
}

// ── CHARTS ────────────────────────────────────────────────
function buildLiqChart(cfg, buckets) {
  const labels = buckets.map(r => num(r.price_lower_usd_per_lmts));
  const ourLiq = buckets.map(r => num(r.our_liquidity));
  const extLiq = buckets.map(r => num(r.ext_liquidity));
  charts.liq = new Chart(document.getElementById("liqChart"), {
    type: "bar",
    data: { labels, datasets: [
      { label:"Our liquidity",      data:ourLiq, backgroundColor:cfg.barOur, borderColor:cfg.barOurB, borderWidth:1, barPercentage:1, categoryPercentage:1, borderRadius:0 },
      { label:"External liquidity", data:extLiq, backgroundColor:cfg.barExt, borderColor:cfg.barExtB, borderWidth:1, barPercentage:1, categoryPercentage:1, borderRadius:0 }
    ]},
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      scales: {
        x: { grid:{color:"rgba(255,255,255,0.03)"}, ticks:{color:"#6a7a8e", maxRotation:45, minRotation:45, callback(v){ return "$"+Number(this.getLabelForValue(v)).toFixed(2); }}, title:{display:true,text:"Price USD / LMTS",color:"#6a7a8e",font:{size:9}} },
        y: { grid:{color:"rgba(255,255,255,0.04)"}, ticks:{color:"#6a7a8e", callback:v=>fmtShort(Number(v))} }
      },
      plugins: {
        legend: { labels:{ color:"#c8d4e0", boxWidth:12, boxHeight:9, font:{size:11} } },
        tooltip: { backgroundColor:"rgba(9,13,19,0.97)", borderColor:"rgba(255,255,255,0.07)", borderWidth:1, titleColor:"#fff", bodyColor:"#c8d4e0", padding:12,
          callbacks: {
            title: items => "$"+Number(items[0].label).toFixed(4)+" – $"+(Number(items[0].label)+0.01).toFixed(4),
            label:  ctx  => ctx.dataset.label+": "+fmtShort(num(ctx.raw))
          }
        }
      }
    }
  });
}

function buildPriceChart(cfg, snapshots) {
  const labels = snapshots.map(r => r.timestamp_utc);
  const prices = snapshots.map(r => num(r.price_usd_per_lmts));
  charts.price = new Chart(document.getElementById("priceChart"), {
    type: "line",
    data: { labels, datasets: [{ label:"Price USD / LMTS", data:prices, borderColor:cfg.lineColor, backgroundColor:cfg.lineFill, tension:0.25, pointRadius:2, pointHoverRadius:4, fill:true, borderWidth:2 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      scales: {
        x: { grid:{color:"rgba(255,255,255,0.03)"}, ticks:{color:"#6a7a8e", maxTicksLimit:6} },
        y: { grid:{color:"rgba(255,255,255,0.04)"}, ticks:{color:"#6a7a8e", callback:v=>fmtPrice(Number(v))} }
      },
      plugins: {
        legend: { labels:{ color:"#c8d4e0" } },
        tooltip: { backgroundColor:"rgba(9,13,19,0.97)", borderColor:"rgba(255,255,255,0.07)", borderWidth:1, titleColor:"#fff", bodyColor:"#c8d4e0", padding:12,
          callbacks: { label: ctx => "Price: "+fmtPrice(num(ctx.raw)) }
        }
      }
    }
  });
}
