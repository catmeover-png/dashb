<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMTS LP Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #07090d;
      --panel: #0d1117;
      --border: #1c2433;
      --border-bright: #2a3a52;
      --text: #e8eef5;
      --muted: #6a7a8e;
      --green: #39ff9a;
      --green-dim: rgba(57,255,154,0.1);
      --blue: #4da6ff;
      --blue-dim: rgba(77,166,255,0.1);
      --danger: #ff5566;
      --pool-accent: #c084fc;
      --pool-accent-dim: rgba(192,132,252,0.12);
      --pool-accent-glow: rgba(192,132,252,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      /* tabular numbers everywhere — no more jumping */
      font-variant-numeric: tabular-nums;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: normal; /* heading doesn't need tabular */
    }

    .header-left h1 .accent { color: var(--pool-accent); }

    .header-left .subtitle {
      font-size: 10px;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── SWITCHER ── */
    .switcher {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .switcher button {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 8px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      background: transparent;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .switcher button.active {
      background: var(--pool-accent-dim);
      color: var(--pool-accent);
      box-shadow: 0 0 12px var(--pool-accent-glow);
    }

    .switcher button:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }

    /* ── STATUS ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 18px;
      letter-spacing: 0.06em;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── CARDS ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px 14px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, var(--pool-accent) 50%, transparent 95%);
      opacity: 0.5;
    }

    .card .label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }

    .card .value {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.15;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      /* fixed character width prevents jumping */
    }

    .card .value.accent { color: var(--pool-accent); }

    /* ── PANELS ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-variant-numeric: normal;
    }

    .panel-title .pill {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--pool-accent-dim);
      color: var(--pool-accent);
      letter-spacing: 0.06em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 14px;
      align-items: start;
    }

    /* ── CHARTS ── */
    .chart-wrap { position: relative; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }

    /* ── MINI TABLE ── */
    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .mini-table tr { border-bottom: 1px solid rgba(28,36,51,0.8); }
    .mini-table tr:last-child { border-bottom: none; }

    .mini-table th {
      color: var(--muted);
      font-weight: 400;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 9px 0;
      text-align: left;
      width: 55%;
    }

    .mini-table td {
      padding: 9px 0;
      text-align: right;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .mini-table td.green { color: var(--green); }
    .mini-table td.blue  { color: var(--blue); }
    .mini-table td.accent { color: var(--pool-accent); }

    /* ── POSITIONS TABLE ── */
    .table-wrap {
      max-height: 500px;
      overflow: auto;
      border-radius: 8px;
    }

    .table-wrap::-webkit-scrollbar { width: 3px; height: 3px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    table.pos-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    table.pos-table th,
    table.pos-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(28,36,51,0.6);
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    table.pos-table th {
      color: var(--muted);
      font-weight: 500;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: sticky;
      top: 0;
      background: #0d1117;
      z-index: 2;
    }

    table.pos-table tbody tr:hover { background: rgba(255,255,255,0.02); }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-weight: 500;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .tag-ours { background: var(--green-dim); color: var(--green); }
    .tag-ext  { background: var(--blue-dim);  color: var(--blue); }

    .inrange  { color: var(--green); }
    .outrange { color: var(--muted); }

    /* ── LOADING / ERROR ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      gap: 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--pool-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: var(--danger);
      font-size: 11px;
      padding: 14px 16px;
      background: rgba(255,85,102,0.07);
      border: 1px solid rgba(255,85,102,0.18);
      border-radius: 8px;
      margin-top: 12px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .header { flex-direction: column; }
      .card .value { font-size: 19px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-left">
      <h1>LMTS / USDC&nbsp;<span class="accent" id="headerPoolName">UniV3</span></h1>
      <div class="subtitle" id="headerSubtitle">Uniswap V3 · Base Network · LP Position Tracker</div>
    </div>
    <div class="switcher">
      <button id="btnUni"  class="active" onclick="switchPool('uni')">⬡ UniV3</button>
      <button id="btnAero"             onclick="switchPool('aero')">◈ Aerodrome</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="lastUpdate">Loading…</span>
  </div>

  <div id="dashContent">
    <div class="loading"><div class="spinner"></div><span>Fetching data…</span></div>
  </div>

</div>
<script>
// ── CONFIG ───────────────────────────────────────────────
const POOLS = {
  uni: {
    sheetId:   "1oJf881yq6bhUSlLBvuiG8n_hj2pWvPO-7lvis0eKXVs",
    name:      "UniV3",
    subtitle:  "Uniswap V3 · Base Network · LP Position Tracker",
    accent:    "#c084fc",
    accentDim: "rgba(192,132,252,0.12)",
    accentGlow:"rgba(192,132,252,0.2)",
    barOur:    "rgba(57,255,154,0.88)",
    barExt:    "rgba(192,132,252,0.28)",
    barOurB:   "rgba(57,255,154,1)",
    barExtB:   "rgba(192,132,252,0.6)",
    lineColor: "#c084fc",
    lineFill:  "rgba(192,132,252,0.1)",
    sheets:    { buckets:"buckets", snapshots:"snapshots", positions:"positions" },
  },
  aero: {
    sheetId:   "14zlvfkLX8Hs3_duak9ID0BGsLfyIVJ_UZ9MOP9lY-oE",
    name:      "Aerodrome",
    subtitle:  "Aerodrome Slipstream · Base Network · LP Position Tracker",
    accent:    "#00d4aa",
    accentDim: "rgba(0,212,170,0.12)",
    accentGlow:"rgba(0,212,170,0.2)",
    barOur:    "rgba(57,255,154,0.88)",
    barExt:    "rgba(0,212,170,0.28)",
    barOurB:   "rgba(57,255,154,1)",
    barExtB:   "rgba(0,212,170,0.6)",
    lineColor: "#00d4aa",
    lineFill:  "rgba(0,212,170,0.1)",
    sheets:    { buckets:"aero_buckets", snapshots:"aero_snapshots", positions:"aero_positions" },
  }
};

let activePool = "uni";
let charts = {};

// ── THEME ────────────────────────────────────────────────
function applyTheme(cfg) {
  const r = document.documentElement;
  r.style.setProperty("--pool-accent",     cfg.accent);
  r.style.setProperty("--pool-accent-dim", cfg.accentDim);
  r.style.setProperty("--pool-accent-glow",cfg.accentGlow);
}

// ── UTILS ────────────────────────────────────────────────
const num = v => { const x = Number(v); return isFinite(x) ? x : 0; };

function fmtShort(v) {
  if (!isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toFixed(2)+"T";
  if (a >= 1e9)  return (v/1e9).toFixed(2)+"B";
  if (a >= 1e6)  return (v/1e6).toFixed(2)+"M";
  if (a >= 1e3)  return (v/1e3).toFixed(2)+"K";
  return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
}

const fmtUsd   = v => isFinite(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }) : "—";
const fmtPrice = v => isFinite(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits:4, maximumFractionDigits:6 }) : "—";

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

const sheetUrl = (id, tab) => `https://opensheet.elk.sh/${id}/${tab}`;
const setText  = (id, v)   => { const el = document.getElementById(id); if(el) el.textContent = v; };

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

// ── SWITCH ───────────────────────────────────────────────
function switchPool(pool) {
  if (pool === activePool) return;
  activePool = pool;
  const cfg = POOLS[pool];
  applyTheme(cfg);
  document.getElementById("btnUni").classList.toggle("active",  pool === "uni");
  document.getElementById("btnAero").classList.toggle("active", pool === "aero");
  document.getElementById("headerPoolName").textContent = cfg.name;
  document.getElementById("headerSubtitle").textContent = cfg.subtitle;
  destroyCharts();
  renderDash(cfg);
}

// ── MAIN RENDER ──────────────────────────────────────────
async function renderDash(cfg) {
  const content = document.getElementById("dashContent");
  content.innerHTML = `<div class="loading"><div class="spinner"></div><span>Loading ${cfg.name}…</span></div>`;

  try {
    const [buckets, snapshots, positions] = await Promise.all([
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.buckets)),
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.snapshots)),
      fetchJson(sheetUrl(cfg.sheetId, cfg.sheets.positions)),
    ]);

    const snap  = snapshots[snapshots.length - 1] || {};
    const price = num(snap.price_usd_per_lmts);
    const ourV  = num(snap.our_cur_usdc) + num(snap.our_cur_lmts) * price;
    const extV  = num(snap.ext_cur_usdc) + num(snap.ext_cur_lmts) * price;

    document.getElementById("lastUpdate").textContent =
      `Updated ${snap.timestamp_utc || "—"} UTC  ·  Block ${snap.last_block || "—"}`;

    content.innerHTML = buildHTML(cfg);

    // stat cards
    setText("price",        fmtPrice(price));
    setText("openPositions",String(num(snap.open_positions)));
    setText("ourValueUsd",  fmtUsd(ourV));
    setText("extValueUsd",  fmtUsd(extV));

    // snapshot panel
    setText("ourUsdc", fmtUsd(num(snap.our_cur_usdc)));
    setText("ourLmts", fmtShort(num(snap.our_cur_lmts)) + " LMTS");
    setText("extUsdc", fmtUsd(num(snap.ext_cur_usdc)));
    setText("extLmts", fmtShort(num(snap.ext_cur_lmts)) + " LMTS");
    setText("owners",  num(snap.unique_real_owners).toLocaleString("en-US"));
    setText("inRange", num(snap.in_range_positions).toLocaleString("en-US"));
    setText("ourPos",  num(snap.our_positions).toLocaleString("en-US"));
    setText("tick",    num(snap.current_tick).toLocaleString("en-US"));

    buildLiqChart(cfg, buckets);
    buildPriceChart(cfg, snapshots);
    buildPositionsTable(positions, price);

  } catch (err) {
    content.innerHTML = `<div class="error-msg">⚠ ${err.message}</div>`;
    console.error(err);
  }
}

// ── HTML SKELETON ────────────────────────────────────────
function buildHTML(cfg) {
  return `
  <div class="cards">
    <div class="card">
      <div class="label">Current Price</div>
      <div class="value accent" id="price">—</div>
    </div>
    <div class="card">
      <div class="label">Open Positions</div>
      <div class="value" id="openPositions">—</div>
    </div>
    <div class="card">
      <div class="label">Our Value (USD)</div>
      <div class="value" id="ourValueUsd">—</div>
    </div>
    <div class="card">
      <div class="label">External Value (USD)</div>
      <div class="value" id="extValueUsd">—</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Liquidity Distribution <span class="pill">${cfg.name} · USD/LMTS</span></div>
    <div class="chart-wrap" style="height:360px"><canvas id="liqChart"></canvas></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-title">Price History <span class="pill">LMTS / USD</span></div>
      <div class="chart-wrap" style="height:300px"><canvas id="priceChart"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-title">Current Snapshot <span class="pill">${cfg.name}</span></div>
      <table class="mini-table">
        <tr><th>Our USDC</th>      <td class="green"  id="ourUsdc">—</td></tr>
        <tr><th>Our LMTS</th>      <td class="green"  id="ourLmts">—</td></tr>
        <tr><th>Ext USDC</th>      <td class="blue"   id="extUsdc">—</td></tr>
        <tr><th>Ext LMTS</th>      <td class="blue"   id="extLmts">—</td></tr>
        <tr><th>Unique Owners</th> <td               id="owners">—</td></tr>
        <tr><th>In-Range</th>      <td class="accent" id="inRange">—</td></tr>
        <tr><th>Our Positions</th> <td               id="ourPos">—</td></tr>
        <tr><th>Current Tick</th>  <td               id="tick">—</td></tr>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Open Positions <span class="pill">${cfg.name}</span></div>
    <div class="table-wrap">
      <table class="pos-table">
        <thead><tr>
          <th>Token ID</th>
          <th>Label</th>
          <th>Price Range (USD/LMTS)</th>
          <th>In Range</th>
          <th>Cur USDC</th>
          <th>Cur LMTS</th>
          <th>Value USD</th>
        </tr></thead>
        <tbody id="posBody"></tbody>
      </table>
    </div>
  </div>`;
}

// ── LIQUIDITY CHART ──────────────────────────────────────
function buildLiqChart(cfg, buckets) {
  // Both pools now use price buckets (price_lower_usd_per_lmts)
  const labels  = buckets.map(r => num(r.price_lower_usd_per_lmts));
  const ourLiq  = buckets.map(r => num(r.our_liquidity));
  const extLiq  = buckets.map(r => num(r.ext_liquidity));

  charts.liq = new Chart(document.getElementById("liqChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label:"Our liquidity",      data:ourLiq, backgroundColor:cfg.barOur, borderColor:cfg.barOurB, borderWidth:1, barPercentage:1, categoryPercentage:1, borderRadius:0 },
        { label:"External liquidity", data:extLiq, backgroundColor:cfg.barExt, borderColor:cfg.barExtB, borderWidth:1, barPercentage:1, categoryPercentage:1, borderRadius:0 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      scales: {
        x: {
          grid:  { color:"rgba(255,255,255,0.03)" },
          ticks: { color:"#6a7a8e", maxRotation:45, minRotation:45,
            callback(val) {
              const v = Number(this.getLabelForValue(val));
              return "$" + v.toFixed(2);
            }
          },
          title: { display:true, text:"Price USD / LMTS", color:"#6a7a8e", font:{size:9} }
        },
        y: {
          grid:  { color:"rgba(255,255,255,0.04)" },
          ticks: { color:"#6a7a8e", callback: v => fmtShort(Number(v)) }
        }
      },
      plugins: {
        legend: { labels:{ color:"#c8d4e0", boxWidth:12, boxHeight:9, font:{size:11} } },
        tooltip: {
          backgroundColor:"rgba(9,13,19,0.97)",
          borderColor:"rgba(255,255,255,0.07)", borderWidth:1,
          titleColor:"#fff", bodyColor:"#c8d4e0", padding:12,
          callbacks: {
            title: items => `$${Number(items[0].label).toFixed(4)} – $${(Number(items[0].label)+0.01).toFixed(4)}`,
            label: ctx  => `${ctx.dataset.label}: ${fmtShort(num(ctx.raw))}`
          }
        }
      }
    }
  });
}

// ── PRICE CHART ───────────────────────────────────────────
function buildPriceChart(cfg, snapshots) {
  const labels = snapshots.map(r => r.timestamp_utc);
  const prices = snapshots.map(r => num(r.price_usd_per_lmts));

  charts.price = new Chart(document.getElementById("priceChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label:"Price USD / LMTS",
        data: prices,
        borderColor: cfg.lineColor,
        backgroundColor: cfg.lineFill,
        tension: 0.25,
        pointRadius: 2,
        pointHoverRadius: 4,
        fill: true,
        borderWidth: 2,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      scales: {
        x: { grid:{color:"rgba(255,255,255,0.03)"}, ticks:{color:"#6a7a8e", maxTicksLimit:6} },
        y: { grid:{color:"rgba(255,255,255,0.04)"}, ticks:{color:"#6a7a8e", callback: v => fmtPrice(Number(v))} }
      },
      plugins: {
        legend: { labels:{ color:"#c8d4e0" } },
        tooltip: {
          backgroundColor:"rgba(9,13,19,0.97)",
          borderColor:"rgba(255,255,255,0.07)", borderWidth:1,
          titleColor:"#fff", bodyColor:"#c8d4e0", padding:12,
          callbacks: { label: ctx => `Price: ${fmtPrice(num(ctx.raw))}` }
        }
      }
    }
  });
}

// ── POSITIONS TABLE ──────────────────────────────────────
function buildPositionsTable(positions, currentPrice) {
  const body = document.getElementById("posBody");
  if (!body) return;

  positions
    .map(p => ({ ...p, _val: num(p.cur_usdc) + num(p.cur_lmts) * currentPrice }))
    .sort((a,b) => b._val - a._val)
    .forEach(p => {
      const isOurs   = p.type === "ours";
      const isInRange = String(p.in_range).toUpperCase() === "TRUE";
      const lo = Number(p.price_lower_usd_per_lmts);
      const hi = Number(p.price_upper_usd_per_lmts);
      const range = (isFinite(lo) && isFinite(hi))
        ? `$${lo.toFixed(4)} – $${hi.toFixed(4)}`
        : `${p.tick_lower ?? "—"} – ${p.tick_upper ?? "—"}`;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="color:var(--muted);font-size:10px">${p.token_id || "—"}</td>
        <td><span class="tag ${isOurs ? "tag-ours" : "tag-ext"}">${p.label || p.type || "ext"}</span></td>
        <td style="color:var(--muted);font-size:10px">${range}</td>
        <td class="${isInRange ? "inrange" : "outrange"}">${isInRange ? "● IN" : "○ OUT"}</td>
        <td>${fmtUsd(num(p.cur_usdc))}</td>
        <td>${fmtShort(num(p.cur_lmts))}</td>
        <td style="font-weight:500">${fmtUsd(p._val)}</td>
      `;
      body.appendChild(tr);
    });
}

// ── INIT ─────────────────────────────────────────────────
applyTheme(POOLS[activePool]);
renderDash(POOLS[activePool]);
</script>
</body>
